<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="375" height="812" fill="url(#bg)"/>
  
  <!-- App Header -->
  <rect x="0" y="0" width="375" height="100" fill="#ffffff" opacity="0.95"/>
  <circle cx="50" cy="50" r="25" fill="#F59E0B"/>
  <text x="90" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">ArogyaDiet</text>
  <text x="90" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Rider App</text>
  
  <!-- Status Bar -->
  <rect x="16" y="120" width="343" height="80" rx="12" fill="#ffffff" opacity="0.95"/>
  <circle cx="50" cy="160" r="15" fill="#10B981"/>
  <text x="80" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">On Duty</text>
  <text x="80" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">GPS Tracking Active</text>
  
  <!-- Route Card -->
  <rect x="16" y="220" width="343" height="200" rx="12" fill="#ffffff" opacity="0.95"/>
  <text x="32" y="250" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1f2937">Today's Route</text>
  <text x="32" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">12 deliveries • Est. 4h 30m</text>
  
  <!-- Delivery Items -->
  <rect x="32" y="295" width="311" height="35" rx="6" fill="#F3F4F6"/>
  <circle cx="50" cy="312" r="8" fill="#10B981"/>
  <text x="70" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#1f2937">1. 123 Main St - Meal Plan</text>
  
  <rect x="32" y="340" width="311" height="35" rx="6" fill="#F3F4F6"/>
  <circle cx="50" cy="357" r="8" fill="#F59E0B"/>
  <text x="70" y="363" font-family="system-ui, sans-serif" font-size="11" fill="#1f2937">2. 456 Oak Ave - Lunch Only</text>
  
  <rect x="32" y="385" width="311" height="25" rx="6" fill="#F3F4F6"/>
  <text x="50" y="403" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">+ 10 more deliveries</text>
  
  <!-- Earnings Card -->
  <rect x="16" y="440" width="343" height="80" rx="12" fill="#ffffff" opacity="0.95"/>
  <text x="32" y="470" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1f2937">Today's Earnings</text>
  <text x="32" y="500" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#10B981">₹847.50</text>
  
  <!-- Bottom Navigation -->
  <rect x="0" y="762" width="375" height="50" fill="#ffffff"/>
  <text x="60" y="792" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">Route</text>
  <text x="145" y="792" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">Map</text>
  <text x="230" y="792" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">History</text>
  <text x="315" y="792" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">Profile</text>
  
  <!-- Placeholder notice -->
  <rect x="16" y="540" width="343" height="200" rx="12" fill="#FEF3C7" opacity="0.95"/>
  <text x="187" y="620" font-family="system-ui, sans-serif" font-size="14" fill="#92400E" text-anchor="middle">📷 Placeholder Screenshot</text>
  <text x="187" y="650" font-family="system-ui, sans-serif" font-size="11" fill="#92400E" text-anchor="middle">Replace with actual app screenshot</text>
  <text x="187" y="680" font-family="system-ui, sans-serif" font-size="11" fill="#92400E" text-anchor="middle">Recommended: 375x812px PNG</text>
</svg>