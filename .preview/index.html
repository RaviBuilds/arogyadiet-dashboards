<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ArogyaDiet Dashboards &amp; Features</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 980px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #1a1a1a; }
  pre { background: #f6f8fa; padding: 12px; overflow-x: auto; border-radius: 6px; }
  code { background: #f6f8fa; padding: 2px 4px; border-radius: 4px; font-size: 0.9em; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 0.92em; }
  th, td { border: 1px solid #d0d7de; padding: 6px 10px; text-align: left; }
  th { background: #f6f8fa; }
  h1, h2, h3 { border-bottom: 1px solid #eaecef; padding-bottom: 6px; }
  blockquote { border-left: 4px solid #d0d7de; margin: 0; padding-left: 12px; color: #57606a; }
  .mermaid { text-align: center; }
</style>
</head>
<body>
<div id="content">Loading…</div>
<script>
  mermaid.initialize({ startOnLoad: false });

  fetch('/AROGYADIET_DASHBOARDS_FEATURES.md')
    .then(r => r.text())
    .then(md => {
      // Protect mermaid code blocks from marked's own HTML escaping by
      // rendering them into <div class="mermaid"> blocks after markdown parse.
      const renderer = new marked.Renderer();
      const origCode = renderer.code.bind(renderer);
      renderer.code = function (code, lang) {
        if (lang === 'mermaid') {
          return '<div class="mermaid">' + code + '</div>';
        }
        return origCode(code, lang);
      };
      marked.setOptions({ renderer, gfm: true, breaks: false });
      document.getElementById('content').innerHTML = marked.parse(md);
      mermaid.run({ querySelector: '.mermaid' });
    })
    .catch(err => {
      document.getElementById('content').textContent = 'Failed to load markdown: ' + err;
    });
</script>
</body>
</html>
